<style>
:root{--bg:#0a1628;--card:#122340;--line:#22385a;--tx:#e8eefb;--mu:#8fa3c2;--ac:#3d8bfd;--ok:#22c55e;--okbg:#0f3a30;--low:#f5a524;--hi:#60a5fa;--glow:#17315f;--card2:#173056;--b1:#4c9bff;--b2:#2a6fe0;--bsh:rgba(35,100,220,.35);--ac2:#7db5ff;--bar:rgba(10,22,40,.92);--nav:#0d1d36;--acbg:rgba(61,139,253,.22);--h1:#1c3c6e;--h2:#112240;--ov:rgba(4,10,22,.7);--dim:#4a6490}
:root[data-theme="maroon"]{--bg:#070405;--card:#170a0d;--line:#3a1820;--tx:#f6eaec;--mu:#b5969c;--ac:#c4314f;--hi:#f08ca0;--glow:#3d0b16;--card2:#240e14;--b1:#a3213b;--b2:#6e0f20;--bsh:rgba(128,16,38,.45);--ac2:#ea8497;--bar:rgba(7,4,5,.92);--nav:#100608;--acbg:rgba(196,49,79,.22);--h1:#45101d;--h2:#12070a;--ov:rgba(0,0,0,.75);--dim:#73404a}
:root[data-theme="forest"]{--bg:#050a07;--card:#0d1a12;--line:#1f3a2a;--tx:#e8f5ec;--mu:#93b09d;--ac:#2fbf71;--hi:#7ee0a8;--glow:#0f3320;--card2:#12261a;--b1:#2fa865;--b2:#16703f;--bsh:rgba(22,112,63,.4);--ac2:#7ee0a8;--bar:rgba(5,10,7,.92);--nav:#08120c;--acbg:rgba(47,191,113,.2);--h1:#14412a;--h2:#0a160f;--ov:rgba(0,0,0,.75);--dim:#3f6b52;--okbg:#123b2a}
:root[data-theme="royal"]{--bg:#0b0716;--card:#160f2b;--line:#2f2452;--tx:#efeafb;--mu:#a69cc6;--ac:#8b5cf6;--hi:#c4b5fd;--glow:#2a1657;--card2:#1e1540;--b1:#9b6dff;--b2:#6232d8;--bsh:rgba(98,50,216,.4);--ac2:#c4b5fd;--bar:rgba(11,7,22,.92);--nav:#0f0a20;--acbg:rgba(139,92,246,.22);--h1:#33206b;--h2:#130c26;--ov:rgba(3,1,10,.75);--dim:#54477e}
:root[data-theme="ocean"]{--bg:#03141a;--card:#082631;--line:#16404d;--tx:#e4f6f8;--mu:#8fb5bd;--ac:#14b8c4;--hi:#67e8f9;--glow:#06404d;--card2:#0b3240;--b1:#18c2cf;--b2:#0b7f94;--bsh:rgba(11,127,148,.4);--ac2:#67e8f9;--bar:rgba(3,20,26,.92);--nav:#051c24;--acbg:rgba(20,184,196,.2);--h1:#0b4a5a;--h2:#061d26;--ov:rgba(0,6,10,.75);--dim:#2f6370}
:root[data-theme="ember"]{--bg:#0c0907;--card:#1a1410;--line:#3a2c21;--tx:#f8efe7;--mu:#b9a594;--ac:#f97316;--hi:#fdba74;--glow:#3d1d08;--card2:#241a13;--b1:#f2771c;--b2:#c2410c;--bsh:rgba(194,65,12,.4);--ac2:#fdba74;--bar:rgba(12,9,7,.92);--nav:#130e0b;--acbg:rgba(249,115,22,.2);--h1:#4a230d;--h2:#140e0a;--ov:rgba(0,0,0,.75);--dim:#6e5340}
:root[data-theme="graphite"]{--acfg:#0b0c0e;--bg:#0b0c0e;--card:#16181c;--line:#2c3036;--tx:#f1f2f4;--mu:#9ba1aa;--ac:#cfd4dc;--hi:#e5e7eb;--glow:#24272d;--card2:#1d2025;--b1:#5b626d;--b2:#363b43;--bsh:rgba(0,0,0,.45);--ac2:#e5e7eb;--bar:rgba(11,12,14,.92);--nav:#101114;--acbg:rgba(207,212,220,.16);--h1:#2a2e35;--h2:#121316;--ov:rgba(0,0,0,.75);--dim:#4b515a}
.sw{display:flex;align-items:center;gap:12px;width:100%;padding:10px 6px;border-radius:10px;text-align:left}
.sw.on{background:var(--acbg)}
.sw i{display:flex;flex:none;width:44px;height:26px;border-radius:13px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.sw i span{flex:1}
.sw b{flex:1}
.thm{margin-left:auto;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--ac2)}
@font-face{font-family:"SummitFile";src:url("Summit.otf") format("opentype"),url("Summit.ttf") format("truetype"),url("Summit.woff2") format("woff2");font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Summit","SummitFile",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:12px 12px 96px;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1{font-size:28px;margin:8px 0 14px}
.mu{color:var(--mu)}
.btn{display:block;width:100%;padding:13px;border-radius:10px;background:var(--ac);font-weight:600;margin-bottom:10px;text-align:center}
.btn.ghost{background:var(--card);color:var(--ac)}
.btn.red{background:none;color:#ef4444}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:8px 0 10px}
.top input{flex:1;min-width:0;background:none;border:0;font-size:20px;font-weight:700}
.fin{background:var(--ok);color:#04210f;font-weight:700;padding:8px 16px;border-radius:8px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px}
.eh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.eh b{flex:1;color:var(--ac);font-size:17px}
.pill{font-size:12px;color:var(--mu);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.x{color:var(--mu);font-size:20px;padding:2px 8px}
.tip{font-size:13px;color:var(--ok);margin:0 0 6px}
.g{display:grid;grid-template-columns:34px 1fr 78px 78px 40px;gap:6px;align-items:center}
.gh{font-size:11px;color:var(--mu);font-weight:700;text-align:center;margin-bottom:4px;letter-spacing:.04em}
.row{padding:4px 0;border-radius:8px}
.row.done{background:var(--okbg)}
.n{text-align:center;font-weight:700;background:var(--bg);border-radius:6px;padding:6px 0}
.pv{text-align:center;color:var(--mu);font-size:14px}
.row input{width:100%;text-align:center;background:var(--bg);border:1px solid transparent;border-radius:6px;padding:7px 2px;font-weight:600;font-variant-numeric:tabular-nums}
.row.done input{background:transparent}
.row input.low{color:var(--low)}.row input.high{color:var(--hi)}
.ck{width:34px;height:34px;border-radius:8px;background:var(--bg);color:var(--mu);font-weight:700;justify-self:center}
.row.done .ck{background:var(--ok);color:#04210f}
.sb{display:flex;gap:8px;margin-top:8px}
.sb button{flex:1;background:var(--bg);border-radius:8px;padding:9px;font-weight:600}
.sb button.s{flex:0 0 44px;color:var(--mu)}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.hd b{font-size:17px}
.ln{display:flex;gap:10px;font-size:14px;padding:1px 0;font-variant-numeric:tabular-nums}
.ln span:first-child{color:var(--mu);width:20px}
.ln.exn{color:var(--ac);font-weight:600;margin-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;padding:12px 0;color:var(--mu);font-size:13px;font-weight:600}
nav button.on{color:var(--ac)}
.ov{position:fixed;inset:0;background:var(--ov);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);border:1px solid var(--line);width:min(100%,330px);max-height:58vh;overflow:auto;border-radius:14px;padding:12px;font-size:14px}
@media (prefers-reduced-motion:no-preference){button{transition:transform .45s cubic-bezier(.34,1.7,.5,1),background-color .2s,color .2s}}
@media (hover:hover){button:hover{transform:scale(.9)}.btn:hover,.li:hover,.sb button:hover{transform:scale(.97)}}
button:active{transform:scale(.82)}
.sheet{transform-origin:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
@media (prefers-reduced-motion:no-preference){.sheet{transition:transform .5s cubic-bezier(.34,1.7,.5,1),box-shadow .35s ease;animation:pop .45s cubic-bezier(.34,1.56,.5,1)}@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}}
@media (hover:hover){.sheet:hover{transform:scale(.96);box-shadow:0 8px 24px rgba(0,0,0,.35)}}
.btn:active,.li:active,.sb button:active{transform:scale(.94)}
.sheet input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.li{display:flex;justify-content:space-between;width:100%;padding:11px 4px;border-bottom:1px solid var(--line);text-align:left}
.nw{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px}
.nw .btn{grid-column:1/-1;margin:2px 0 0}
.er{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.er:last-child{border:0}
.er div{flex:1}
.er small{display:block;color:var(--mu)}
.lk{color:var(--ac);padding:4px 6px;font-size:14px}
.sp{display:flex;align-items:center;gap:12px}
.sp button{background:var(--bg);border-radius:6px;width:34px;height:34px;font-size:18px}
.sm{font-size:14px;margin:2px 0 10px}
.seg{display:flex;background:var(--card);border-radius:8px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:7px;border-radius:6px;color:var(--mu);font-weight:600;font-size:14px}
.seg button.on{background:var(--ac);color:var(--acfg,#fff)}
.sheet.wide{width:min(100%,400px);max-height:82vh}
.dlg{width:min(100%,320px);padding:16px}
.dlg p{margin:0 0 14px;font-size:15px;line-height:1.45;white-space:pre-line}
.dlg input{margin-bottom:14px}
.dbtn{display:flex;gap:8px}.dbtn .btn{margin:0;flex:1;padding:11px}
.btn.dng{background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 6px 16px rgba(220,38,38,.35)}
.mbtn{display:flex;align-items:center;justify-content:center;gap:8px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stats div{flex:1;background:var(--card);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-size:17px}
.stats span{color:var(--mu);font-size:12px}
.ch{background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px}
.ch svg{width:100%;height:auto;display:block}

/* ---- design layer ---- */
body{background:radial-gradient(900px 420px at 50% -120px,var(--glow) 0%,transparent 70%),var(--bg);background-attachment:fixed}
.brand{display:flex;align-items:center;gap:10px;padding:6px 2px 12px;font-weight:800;font-size:20px;letter-spacing:.01em}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
.card{background:linear-gradient(165deg,var(--card2) 0%,var(--card) 55%);border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.card.ex{border-left:4px solid var(--ac)}
.btn{background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:0 6px 16px var(--bsh),inset 0 1px 0 rgba(255,255,255,.25);border-radius:14px}
.btn.ghost{background:linear-gradient(165deg,var(--card2),var(--card));box-shadow:inset 0 0 0 1px var(--line);color:var(--ac2)}
.btn.red{background:none;box-shadow:none}
.fin{background:linear-gradient(135deg,#34d27a,#16a34a);box-shadow:0 4px 12px rgba(34,197,94,.35);border-radius:10px}
.top{background:var(--bar);backdrop-filter:blur(10px)}
.eh b{font-size:18px;font-weight:700}
.n{border-radius:50%;width:28px;height:28px;display:grid;place-items:center;padding:0;border:2px solid var(--line);background:transparent;justify-self:center}
.row.done .n{background:var(--ok);border-color:var(--ok);color:#04210f}
.row.done{box-shadow:inset 0 0 0 1px rgba(34,197,94,.35)}
.ck{border-radius:50%}
nav{background:var(--bar);backdrop-filter:blur(10px)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
nav button.on{color:var(--ac2)}
.ic{display:grid;place-items:center;width:48px;height:28px;border-radius:14px}
nav button.on .ic{background:var(--acbg)}
nav button{min-width:0;font-size:11px;letter-spacing:-.1px}
.ic{width:44px}
.hero{display:flex;align-items:center;gap:18px;padding:16px;margin-bottom:14px;border-radius:22px;background:linear-gradient(160deg,var(--h1),var(--h2));border:1px solid var(--line)}
.hero .rg{width:128px;flex:none}.hero .rg svg{width:100%;display:block}
.hs{flex:1;display:grid;gap:14px}
.hs b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.hs span{color:var(--mu);font-size:13px}
.brand{gap:12px;padding:10px 2px 16px}
.bt{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.15;color:var(--tx)}
/* ---- food ---- */
.sb3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.sb3 .btn{margin-bottom:14px;padding:12px 4px;font-size:14px}
.mtw{position:relative;padding:0;flex:none;border-radius:12px}.mtc{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 6px}
.mth.sm{width:48px;height:48px;border-radius:10px;font-size:20px}
.pv{flex-direction:column;gap:10px;padding:16px 0}.pvs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;padding:0 16px}.pvs img{flex:none;width:calc(100% - 8px);max-height:76vh;object-fit:contain;border-radius:12px;scroll-snap-align:center}
.phs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.phs.scan img{animation:scan 1.2s ease-in-out infinite alternate}
.pht{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}.pht img{width:100%;height:100%;object-fit:cover;display:block}
.pht.add{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ac2);border-style:dashed;font-size:11px;font-weight:600}.pht.add b{font-size:22px;line-height:1}
.phx{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:15px;line-height:20px}
.lbr{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}.lbr:last-child{border-bottom:0}
.lbm{flex:1;min-width:0;display:flex;gap:10px;align-items:center;text-align:left;padding:8px 0}.lbm .mm{margin:2px 0}
.kp{display:flex;align-items:center;gap:8px;margin:2px 0 10px;font-size:14px}.kp input{width:18px!important;height:18px;margin:0!important;accent-color:var(--ac)}
.gh1{margin:8px 0 6px}.gform .seg{margin-bottom:8px}.gform .btn{margin:10px 0 0}.gform .btn.ghost{margin-top:8px}
.gform input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:18px;font-weight:700;color:inherit}
.gform .mfld input{border:0;padding:2px 0;background:none;font-size:20px}
.bwr{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}.bwr input{flex:1;min-width:0}.bwr .seg{margin:0;width:110px;flex:none}
.gl2{display:block;font-size:12px;color:var(--mu);margin:4px 0 3px}.gsub{margin:-2px 0 10px!important}
.gres{margin-top:8px}.gbig{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.gbig>div{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--m);border-radius:10px;padding:8px 10px}.gbig b{display:block;font-size:24px;font-weight:800;color:var(--m)}.gbig span{font-size:12px;color:var(--mu)}
.cal{padding:10px 8px}.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.ch b{font-size:17px}.ch .x{font-size:26px;color:var(--ac2)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font-size:11px;font-weight:700;color:var(--mu);padding:2px 0 4px}
.cd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 5px;border-radius:10px;background:var(--bg);border:1px solid transparent;min-height:52px;--m:var(--line)}
.cd b{font-size:14px;font-weight:600}.cd small{font-size:10px;color:var(--mu);min-height:12px;line-height:12px}
.cd i{display:block;width:70%;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:auto}.cd i span{display:block;height:100%;background:var(--m)}
.cd.hit{--m:var(--ok)}.cd.under{--m:var(--ac2)}.cd.over{--m:var(--low)}
.cd.now b{color:var(--ac2);font-weight:800}
.cd.sel{background:var(--acbg);border-color:var(--ac)}
.cd:disabled{opacity:.3}
.cl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--mu);margin-top:8px;padding:0 4px}.cl span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--m)}
.cl .hit{--m:var(--ok)}.cl .under{--m:var(--ac2)}.cl .over{--m:var(--low)}.cl .lk{margin-left:auto;font-size:13px;padding:2px 4px}
.fdh{font-size:22px;font-weight:800;margin:4px 0 12px}
.dn{display:flex;align-items:center;justify-content:space-between}.dn h1{margin:8px 0 14px;text-align:center;flex:1}.dn .x{font-size:30px;color:var(--ac2)}
.fm{gap:10px!important}
.mb .mbh{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:4px}.mb .mbh b{font-size:12px!important;font-weight:600;color:var(--tx);display:inline!important}
.mb i{display:block;height:7px;border-radius:4px;background:var(--line);overflow:hidden}.mb i span{display:block;height:100%;border-radius:4px;transition:width .5s}
.mp{--m:#60c3ff}.mc{--m:#f5c04a}.mf{--m:#f47fa8}.mk{--m:var(--ac2)}
.mb i span{background:var(--m)}
.gl{font-size:12px;text-align:left;padding:0}
.snap{font-size:17px;padding:16px}
.sb2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sb2 .btn{margin-bottom:14px}
.meal{display:flex;gap:12px;padding:10px;align-items:flex-start}
.mth{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:var(--bg)}
.mth.ph{display:grid;place-items:center;font-size:26px;border:1px solid var(--line)}
.mi{flex:1;min-width:0}.mi .hd{margin-bottom:2px;gap:8px}.mi .hd b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc{font-weight:700;color:var(--ac2);white-space:nowrap}
.mm{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px;font-size:12px}
.mm>span:not(.pill){color:var(--m);background:color-mix(in srgb,var(--m) 14%,transparent);border-radius:999px;padding:2px 8px;font-weight:600}
.sm0{font-size:12px;margin:0;align-items:center}
.sheet.big{width:min(100%,420px);max-height:88vh}
.fp{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-bottom:10px}
.fp.scan{animation:scan 1.2s ease-in-out infinite alternate}
@keyframes scan{from{filter:brightness(.8) saturate(.8)}to{filter:brightness(1.1) saturate(1.2)}}
.sheet textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;font:inherit;color:inherit;resize:vertical}
.er2{color:var(--low);margin:0 0 8px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 8px}
.mfld{display:block;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--m);border-radius:10px;padding:6px 10px}
.mfld span{display:block;font-size:11px;color:var(--mu);font-weight:600}

async function cloudPush(force){

async function useRecoveryCode(){

function ui(kind,msg,o={}){

    const isP=kind==='p',isC=kind==='c',danger=isC&&(o.danger??/^(delete|remove|cancel|discard|replace)/i.test(msg));

    const ov=h('div',{class:'ov'}),inp=isP?h('input',{type:'text',value:o.value??'','aria-label':msg}):null;
    let fin=false;
    const done=v=>{if(fin)return;fin=true;document.removeEventListener('keydown',key,true);ov.remove();res(v)};
    const no=()=>done(isP?null:isC?false:undefined),yes=()=>done(isP?inp.value:isC?true:undefined);

    const okb=h('button',{class:'btn'+(danger?' dng':''),onclick:yes},okTxt);
    const btns=h('div',{class:'dbtn'},(isC||isP)&&o.cancel!==false?h('button',{class:'btn ghost',onclick:no},o.cancel||'Cancel'):null,okb);
    ov.onclick=e=>{if(e.target===ov&&(isC||isP))no()};

const wkStart=off=>{const n=new Date(),dow=(n.getDay()+6)%7;return new Date(n.getFullYear(),n.getMonth(),n.getDate()-dow-7*off)};

function sessionsOf(id){

function chartSvg(vals,labels){
  const W=320,H=190,L=44,R=12,T=12,B=26,n=vals.length;
  let mn=Math.min(...vals),mx=Math.max(...vals);
  if(mn===mx){mn-=1;mx+=1}
  const pad=(mx-mn)*0.12;mn-=pad;mx+=pad;
  const X=i=>n===1?(L+W-R)/2:L+i*((W-R-L)/(n-1));
  const Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  let g='';
  for(let k=0;k<4;k++){const v=mn+(mx-mn)*k/3,y=Y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="'+C('--line')+'"/><text x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end" fill="'+C('--mu')+'" font-size="10">'+fmtN(v)+'</text>'}
  let o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Progress chart">'+g;
  if(n>1)o+='<defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+C('--ac')+'" stop-opacity=".35"/><stop offset="1" stop-color="'+C('--ac')+'" stop-opacity="0"/></linearGradient></defs><polygon points="'+vals.map((v,i)=>X(i)+','+Y(v)).join(' ')+' '+X(n-1)+','+(H-B)+' '+X(0)+','+(H-B)+'" fill="url(#gA)"/>';
  if(n>1)o+='<polyline points="'+vals.map((v,i)=>X(i)+','+Y(v)).join(' ')+'" fill="none" stroke="'+C('--ac')+'" stroke-width="2.5" stroke-linejoin="round"/>';
  vals.forEach((v,i)=>{o+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="4" fill="'+C('--ac')+'"><title>'+labels[i]+': '+fmtN(v)+'</title></circle>'});
  o+='<text x="'+X(0)+'" y="'+(H-8)+'" fill="'+C('--mu')+'" font-size="10" text-anchor="'+(n===1?'middle':'start')+'">'+labels[0]+'</text>';
  if(n>1)o+='<text x="'+X(n-1)+'" y="'+(H-8)+'" fill="'+C('--mu')+'" font-size="10" text-anchor="end">'+labels[n-1]+'</text>';
  return o+'</svg>';
}
